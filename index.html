<!doctype html>
<!-- Tells the browser: "This is a modern HTML5 page." Always the first line. -->

<html lang="en">
  <!-- lang="en" helps screen readers and search engines know the page language. -->

  <head>
    <!-- Everything in <head> is invisible to the user but important for the browser. -->

    <meta charset="UTF-8" />
    <!-- Makes sure special characters (like & or ©) display correctly. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- This is the key to mobile optimization. Without it, phones zoom out and
       show a shrunken desktop version. This tells the browser: match the screen width. -->

    <title>Gab Webfolio</title>
    <!-- What appears on the browser tab. -->

    <!-- FAVICON: the small icon on the browser tab next to your title.
       Place your icon file in the same folder as index.html.
       Recommended size: 32x32px or 64x64px.
       Free tools to make one: favicon.io or realfavicongenerator.net
       If using a .ico file instead, change type to "image/x-icon" and href to "favicon.ico" -->
    <link
      rel="icon"
      type="image/png"
      href="favicon_node/favicon-32x32.png"
    />

    <!-- PERFORMANCE: preconnect tells the browser to open a connection to Google's
       font servers early — before it even starts downloading the fonts.
       This shaves off a chunk of load time on first visit.
       crossorigin is required on the second one because fonts are loaded
       from a different subdomain (gstatic vs googleapis). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts: loads two fonts from the web.
       DM Mono  → used for name, role, and links (precise, technical)
       DM Sans  → used for the bio (warmer, more readable)
       display=swap means the browser shows text in a fallback font immediately
       while the custom font loads, instead of showing nothing. -->
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Links this HTML file to our stylesheet. The browser reads this
       and applies all the visual styles from style.css. -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- .page is the full-screen wrapper. It centers the card
       both vertically and horizontally using Flexbox (see style.css). -->
    <div class="page">
      <!-- .card is the white/gray box that holds all the content. -->
      <div class="card">
        <!-- AVATAR -->
        <!-- Replace "your-photo.jpg" with your actual photo filename.
           The photo should be in the same folder as this index.html file. -->
        <div class="avatar-wrap">
          <img
            class="avatar"
            src="images/general-headshot.webp"
            fetchpriority="high"
            alt="Gabriel Philip General"
          />
        </div>

        <!-- IDENTITY -->
        <h1 class="name">Gabriel Philip General</h1>
        <p class="role">Business Analyst</p>
        <!-- Note: &amp; is how you write "&" in HTML so the browser doesn't misread it. -->

        <!-- BIO -->
        <p class="bio">
          "I help businesses figure out what they actually need, then document it clearly enough for anyone to act on."
        </p>

        <!-- Horizontal line used as a visual separator between bio and links. -->
        <hr class="divider" />

        <!-- NAV LINKS -->
        <!-- <nav> is a semantic HTML tag. It tells the browser (and screen readers)
           that these are navigation links — not just random text.
           target="_blank" opens the link in a new tab.
           rel="noopener noreferrer" is a security best practice — always pair
           it with target="_blank" to prevent the new tab from accessing your page. -->
        <nav class="nav">
          <a href="what-i-do.html" class="nav-link">
            <span>What I Do</span>
            <span class="arrow">→</span>
          </a>
          <a
            href="https://www.notion.so/gabgeneral/Inside-the-Process-34de05f6a1698034b65dfde21565fe50?source=copy_link" target="_blank" rel="noopener noreferrer"
            class="nav-link"
          >
            <span>Work</span>
            <span class="arrow">→</span>
          </a>
          <a href="https://tally.so/r/D4EY4N" rel="noopener noreferrer" class="nav-link">
            <span>Get In Touch</span>
            <span class="arrow">→</span>
          </a>
        </nav>

        <!-- SOCIAL ICONS -->
        <!-- Each icon is an SVG (Scalable Vector Graphic) — basically a mini drawing
           made of code. They scale perfectly on any screen size without blurring.
           aria-label makes them accessible to screen readers. -->
        <div class="socials">
          <a
            href="https://www.linkedin.com/in/gab-general/"
            class="social-link"
            aria-label="LinkedIn"
            target="_blank"
            rel="noopener noreferrer"
          >
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" alt="LinkedIn button">
              <path
                d="M20.447 20.452H17.01v-5.569c0-1.327-.024-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.588V9h3.297v1.561h.046c.459-.869 1.58-1.784 3.253-1.784 3.481 0 4.124 2.291 4.124 5.269v6.406zM5.337 7.433a1.91 1.91 0 1 1 0-3.82 1.91 1.91 0 0 1 0 3.82zm1.65 13.019H3.685V9h3.302v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"
              />
            </svg>
          </a>

          <a
            href="https://github.com/gab-in-tech"
            class="social-link"
            aria-label="GitHub"
            target="_blank"
            rel="noopener noreferrer"
          >
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" alt="GitHub button">
              <path
                d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"
              />
            </svg>
          </a>

          <a
            href="mailto:gabxgeneral@gmail.com"
            class="social-link"
            aria-label="Email"
          >
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" alt="Email button">
              <path
                d="M20 4H4C2.9 4 2 4.9 2 6v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"
              />
            </svg>
          </a>
        </div>

        <!-- FOOTER -->
        <p class="footer">
          © 2026 Gabriel Philip General. All rights reserved.
        </p>
      </div>
      <!-- end .card -->
    </div>
    <!-- end .page -->
  </body>
</html>
